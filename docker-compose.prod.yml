# Production. Everything sits behind Caddy on one domain with HTTPS from
# Let's Encrypt, and nothing else listens on the internet. Start it with
# scripts/start-prod.sh; docs/DEPLOYMENT.md walks through a first install.
#
# Every secret comes from .env.production, and a missing one stops the start
# with its name rather than falling back to a development default.

name: hausbuch

# Keycloak sends every email (confirming a new owner's address, resetting a
# password), and both it and the realm sync need the same settings.
x-smtp: &smtp
  BMS_SMTP_HOST: ${BMS_SMTP_HOST:?set BMS_SMTP_HOST in .env.production}
  BMS_SMTP_PORT: ${BMS_SMTP_PORT:-587}
  BMS_SMTP_FROM: ${BMS_SMTP_FROM:?set BMS_SMTP_FROM in .env.production}
  BMS_SMTP_AUTH: "true"
  BMS_SMTP_USER: ${BMS_SMTP_USER:?set BMS_SMTP_USER in .env.production}
  BMS_SMTP_PASSWORD: ${BMS_SMTP_PASSWORD:?set BMS_SMTP_PASSWORD in .env.production}
  BMS_SMTP_STARTTLS: "true"

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  caddy:
    image: caddy:2.11-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      BMS_DOMAIN: ${BMS_DOMAIN:?set BMS_DOMAIN in .env.production}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env.production}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and the ACME account; losing them means asking Let's Encrypt again.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - frontend
      - backend
      - keycloak

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bms}
      POSTGRES_USER: ${POSTGRES_USER:-bms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init-keycloak-db.sql:/docker-entrypoint-initdb.d/init-keycloak-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    restart: unless-stopped
    logging: *logging
    command: ["start", "--import-realm"]
    environment:
      <<: *smtp
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?set KEYCLOAK_ADMIN in .env.production}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in .env.production}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-bms}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      # Plain HTTP inside the network; Caddy terminates TLS in front of it.
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      # Served under /auth on the application's own domain, and the issuer of
      # every token is that public address.
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME: https://${BMS_DOMAIN}/auth
      # The admin console answers only on the port bound to localhost below.
      KC_HOSTNAME_ADMIN: http://localhost:${KEYCLOAK_ADMIN_PORT:-8081}/auth
      # Read by the realm import and the sign in theme.
      BMS_PUBLIC_URL: https://${BMS_DOMAIN}
      BMS_KEYCLOAK_CLIENT_SECRET: ${BMS_KEYCLOAK_CLIENT_SECRET:?set BMS_KEYCLOAK_CLIENT_SECRET in .env.production}
      BMS_REGISTER_URL: https://${BMS_DOMAIN}/register
    ports:
      - "127.0.0.1:${KEYCLOAK_ADMIN_PORT:-8081}:8080"
    volumes:
      - ./docker/keycloak/realm-bms.json:/opt/keycloak/data/import/realm-bms.json:ro
      - ./docker/keycloak/themes/bms:/opt/keycloak/themes/bms:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /auth/health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  # Applies the realm export on every start, and seeds the one administrator a
  # new realm needs. It runs once and exits.
  keycloak-sync:
    image: node:24-alpine
    logging: *logging
    command: ["node", "/app/scripts/sync-realm.mjs"]
    environment:
      <<: *smtp
      KEYCLOAK_URL: http://keycloak:8080/auth
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KEYCLOAK_USERS_FILE: docker/keycloak/users-prod.json
      BMS_PUBLIC_URL: https://${BMS_DOMAIN}
      BMS_KEYCLOAK_CLIENT_SECRET: ${BMS_KEYCLOAK_CLIENT_SECRET}
      BMS_ADMIN_USERNAME: ${BMS_ADMIN_USERNAME:?set BMS_ADMIN_USERNAME in .env.production}
      BMS_ADMIN_EMAIL: ${BMS_ADMIN_EMAIL:?set BMS_ADMIN_EMAIL in .env.production}
      BMS_ADMIN_PASSWORD: ${BMS_ADMIN_PASSWORD:?set BMS_ADMIN_PASSWORD in .env.production}
    volumes:
      - ./scripts/sync-realm.mjs:/app/scripts/sync-realm.mjs:ro
      - ./docker/keycloak/realm-bms.json:/app/docker/keycloak/realm-bms.json:ro
      - ./docker/keycloak/users-prod.json:/app/docker/keycloak/users-prod.json:ro
    depends_on:
      keycloak:
        condition: service_healthy

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    logging: *logging
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-bms}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-bms}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      BMS_KEYCLOAK_PUBLIC_URL: https://${BMS_DOMAIN}/auth
      BMS_KEYCLOAK_SERVER_URL: http://keycloak:8080/auth
      BMS_KEYCLOAK_CLIENT_SECRET: ${BMS_KEYCLOAK_CLIENT_SECRET}
      BMS_FRONTEND_BASE_URL: https://${BMS_DOMAIN}
      BMS_CORS_ALLOWED_ORIGINS: https://${BMS_DOMAIN}
      BMS_INVOICE_ISSUER_NAME: ${BMS_INVOICE_ISSUER_NAME:-Hausbuch}
      # Caddy is the only way in, so its X-Forwarded-Proto is trusted: the
      # request counts as HTTPS and the session cookie is marked Secure.
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      SERVER_SERVLET_SESSION_COOKIE_SECURE: "true"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak-sync:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    logging: *logging
    environment:
      BACKEND_ORIGIN: http://backend:8080
    depends_on:
      - backend

  backup:
    image: postgres:18-alpine
    restart: unless-stopped
    logging: *logging
    entrypoint: ["sh", "/backup.sh"]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-bms}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      APP_DB: ${POSTGRES_DB:-bms}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./docker/backup/backup.sh:/backup.sh:ro
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
