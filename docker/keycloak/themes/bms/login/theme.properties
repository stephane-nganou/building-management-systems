parent=keycloak.v2

# The parent's sheet first, then ours on top of it. The page is always the
# light card on the night street, as the application's own gate pages are.
styles=css/styles.css css/bms.css
darkMode=false

# The two languages the app speaks. Everything but our own two keys comes from
# Keycloak's own bundles, which already ship both.
locales=en,fr

# Where "Register here" on the sign in page points. Keycloak runs on its own
# origin in development, so this has to be absolute. Production sets
# BMS_REGISTER_URL on the Keycloak container; the default is development's.
bmsRegisterUrl=${env.BMS_REGISTER_URL:http://localhost:4200/register}
