parent=keycloak.v2

# The two languages the app speaks. Everything but our own two keys comes from
# Keycloak's own bundles, which already ship both.
locales=en,fr

# Where "Register here" on the sign in page points. Keycloak runs on its own
# origin, so this has to be absolute. Like frontend/public/config.js, it is a
# local development value.
bmsRegisterUrl=http://localhost:4200/register
