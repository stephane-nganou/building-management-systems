services:
  postgres:
    image: postgres:18-alpine
    container_name: bms-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bms}
      POSTGRES_USER: ${POSTGRES_USER:-bms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bms}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Postgres 18+ images expect a single mount at /var/lib/postgresql and
      # place the version specific data directory underneath it.
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init-keycloak-db.sql:/docker-entrypoint-initdb.d/init-keycloak-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bms} -d ${POSTGRES_DB:-bms}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Catches every email Keycloak sends, such as the link that confirms a new
  # owner's address. Read them at http://localhost:8025; the end to end suite
  # reads them through its API.
  mailpit:
    image: axllent/mailpit:v1.31.3
    container_name: bms-mailpit
    ports:
      - "${MAILPIT_PORT:-8025}:8025"

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    container_name: bms-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DB:-keycloak}
      KC_DB_USERNAME: ${POSTGRES_USER:-bms}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-bms}
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_PORT: 8080
      # Pin the public URL so the "iss" claim is the same value the browser used,
      # and the same value the backend validates against.
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8081}
      KC_HOSTNAME_STRICT: "false"
    ports:
      - "${KEYCLOAK_PORT:-8081}:8080"
    volumes:
      - ./docker/keycloak/realm-bms.json:/opt/keycloak/data/import/realm-bms.json:ro
      # The sign in page is the one page of Keycloak a user still sees, and it
      # links to our own registration page, so it needs a theme.
      - ./docker/keycloak/themes/bms:/opt/keycloak/themes/bms:ro
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # --import-realm skips a realm that already exists, so on its own a stack
  # started once never sees later changes to realm-bms.json. This applies the
  # export on every start, before the backend comes up.
  keycloak-sync:
    image: node:24-alpine
    container_name: bms-keycloak-sync
    command: ["node", "/app/scripts/sync-realm.mjs"]
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # The demo owner, assistant and administrator the specs sign in as.
      KEYCLOAK_USERS_FILE: docker/keycloak/users-demo.json
    volumes:
      - ./scripts/sync-realm.mjs:/app/scripts/sync-realm.mjs:ro
      - ./docker/keycloak/realm-bms.json:/app/docker/keycloak/realm-bms.json:ro
      - ./docker/keycloak/users-demo.json:/app/docker/keycloak/users-demo.json:ro
    depends_on:
      keycloak:
        condition: service_healthy

  backend:
    build:
      context: ./backend
    container_name: bms-backend
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-bms}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-bms}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-bms}
      # A development stack, so the committed client secret is allowed here.
      BMS_KEYCLOAK_ALLOW_DEFAULT_SECRET: "true"
      # No keystore here: issued invoices are signed with a certificate the
      # backend makes itself at every start.
      BMS_SIGNING_ALLOW_SELF_SIGNED: "true"
      # Two addresses for one Keycloak. The browser is sent to the public one,
      # which is also the issuer every token claims; the token exchange, the
      # signing keys and the admin API go over the internal network.
      BMS_KEYCLOAK_PUBLIC_URL: http://localhost:${KEYCLOAK_PORT:-8081}
      BMS_KEYCLOAK_SERVER_URL: http://keycloak:8080
      # Where the browser comes back to after signing in or out.
      BMS_FRONTEND_BASE_URL: http://localhost:${FRONTEND_PORT:-4200}
      # Every request reaches the backend from the frontend's nginx here, so all
      # sign ups share one address; the end to end suite makes many of them.
      BMS_REGISTRATION_MAX_PER_HOUR: ${BMS_REGISTRATION_MAX_PER_HOUR:-1000}
      BMS_CORS_ALLOWED_ORIGINS: http://localhost:${FRONTEND_PORT:-4200}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak-sync:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
    container_name: bms-frontend
    environment:
      # nginx serves the application and forwards /api to the backend, so the
      # browser only ever talks to one origin.
      BACKEND_ORIGIN: http://backend:8080
    ports:
      - "${FRONTEND_PORT:-4200}:80"
    depends_on:
      - backend

  # A web view of this stack's logs, live, at http://localhost:9999. Off unless
  # the "logs" profile is on: COMPOSE_PROFILES=logs in .env, or scripts/logs.sh
  # --viewer. It only lists the bms-* containers, and its container actions and
  # shell stay off, as they are by default. The socket is mounted read only, but
  # that does not limit the Docker API, which is why it answers on localhost.
  logs:
    image: amir20/dozzle:v11.1.3
    container_name: bms-logs
    profiles: ["logs"]
    environment:
      DOZZLE_FILTER: name=bms-
      DOZZLE_NO_ANALYTICS: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "127.0.0.1:${LOGS_PORT:-9999}:8080"

volumes:
  postgres-data:
