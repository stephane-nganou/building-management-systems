spring:
  application:
    name: building-management-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bms}
    username: ${SPRING_DATASOURCE_USERNAME:bms}
    password: ${SPRING_DATASOURCE_PASSWORD:bms}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${BMS_KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/bms}
          # Set explicitly so the application does not perform OIDC discovery at startup,
          # which would make boot order depend on Keycloak being reachable.
          jwk-set-uri: ${BMS_KEYCLOAK_JWK_SET_URI:http://localhost:8081/realms/bms/protocol/openid-connect/certs}

bms:
  cors:
    allowed-origins: ${BMS_CORS_ALLOWED_ORIGINS:http://localhost:4200}
  keycloak:
    admin:
      # Reached over the internal network, so this is not the public issuer URL.
      server-url: ${BMS_KEYCLOAK_SERVER_URL:http://localhost:8081}
      realm: ${BMS_KEYCLOAK_REALM:bms}
      client-id: ${BMS_KEYCLOAK_ADMIN_CLIENT_ID:bms-backend}
      client-secret: ${BMS_KEYCLOAK_ADMIN_CLIENT_SECRET:bms-backend-secret}
  invoice:
    issuer-name: ${BMS_INVOICE_ISSUER_NAME:Building Management}
    currency: ${BMS_INVOICE_CURRENCY:EUR}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.bms: INFO
