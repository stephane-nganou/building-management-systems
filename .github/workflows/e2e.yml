name: tests

# The pre-push hook runs the same suite locally, but a hook can be skipped and
# is not cloned with the repository. This is the gate that always holds.
on:
  pull_request:
  push:
    branches: [main]

# No job may run longer than 20 minutes. The jobs run side by side, so neither
# may the whole run; every run so far took under ten. Without a limit a hung
# download once held a job for hours, GitHub's default being six.
jobs:
  backend:
    name: backend unit and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # Testcontainers needs a Docker daemon, which the runner already has.
      - run: mvn --batch-mode --no-transfer-progress test
        working-directory: backend

  frontend:
    name: frontend unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend

  e2e:
    name: end to end
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      # The browser is cached per Playwright version, so most runs skip its
      # download; a new version misses the cache and fetches its own.
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
        working-directory: frontend
      - uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium and its system libraries
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
        working-directory: frontend
        timeout-minutes: 8
      # A cached browser still needs the system libraries, which live outside it.
      - name: Install Chromium's system libraries
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
        working-directory: frontend
        timeout-minutes: 8
      - name: Run the suite against the whole stack
        run: scripts/e2e.sh
        timeout-minutes: 10
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
