name: tests

# The pre-push hook runs the same suite locally, but a hook can be skipped and
# is not cloned with the repository. This is the gate that always holds.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: backend unit and integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # Testcontainers needs a Docker daemon, which the runner already has.
      - run: mvn --batch-mode --no-transfer-progress test
        working-directory: backend

  frontend:
    name: frontend unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend

  e2e:
    name: end to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Run the suite against the whole stack
        run: scripts/e2e.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
